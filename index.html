<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute 3D Heroes – demo chọn nhân vật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b2340; --card:#fffaf2; --accent:#ff7a59; --accent2:#4f9dff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink); background:#bfe6ff; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .label { position:absolute; left:0; top:0; padding:1px 9px; border-radius:99px; background:rgba(255,255,255,.85); font-size:13px; font-weight:700; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .label.sel { background:var(--accent); color:#fff; }
  .hpbar { position:absolute; left:0; top:0; width:56px; height:8px; border-radius:6px; background:rgba(0,0,0,.45); border:1.5px solid rgba(255,255,255,.9); overflow:hidden; }
  .hpbar i { display:block; height:100%; width:100%; background:#ef4444; transition:width .1s; }
  .hpbar.hero { width:74px; height:10px; } .hpbar.hero i { background:#22c55e; }
  .hpbar.boss { width:120px; height:12px; } .hpbar.boss i { background:linear-gradient(90deg,#f97316,#dc2626); }
  .dmg { position:absolute; left:0; top:0; font-weight:800; font-size:20px; text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 4px rgba(0,0,0,.4); white-space:nowrap; }

  header { position:fixed; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:rgba(255,255,255,.9); padding:5px; border-radius:99px; box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:5; }
  header button { border:0; padding:8px 20px; border-radius:99px; font:inherit; font-weight:800; font-size:16px; background:transparent; color:var(--ink); cursor:pointer; }
  header button.on { background:var(--accent); color:#fff; }

  #panel { position:fixed; right:14px; top:76px; bottom:14px; width:330px; background:var(--card); border-radius:20px; padding:16px 18px; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.15); z-index:4; }
  #panel h2 { margin:0 0 4px; font-size:26px; line-height:1.1; }
  #panel h3 { margin:16px 0 6px; font-size:16px; }
  #panel .muted { color:#6b6280; margin:6px 0 12px; }
  #panel .tags { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 12px; }
  #panel .tags span { font-size:12px; padding:1px 8px; border-radius:99px; background:#efe6ff; }
  #panel button { font:inherit; font-weight:700; cursor:pointer; border:0; }
  #panel > button, #panel [data-act] { width:100%; padding:10px; border-radius:12px; background:var(--accent2); color:#fff; font-size:16px; }
  #panel button.on { background:#22c55e; color:#fff; }
  .anims { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { padding:3px 10px; border-radius:99px; background:#fff; border:1.5px solid #e6dccb !important; font-size:13px; color:var(--ink); }
  .chip.on { background:var(--accent) !important; color:#fff; border-color:var(--accent) !important; }
  .picks { margin-top:16px; padding:10px 12px; background:#fff; border-radius:12px; font-size:14px; line-height:1.5; border:1.5px dashed #e6dccb; }
  #play { margin-top:12px; width:100%; padding:12px; border-radius:14px; background:var(--accent); color:#fff; font-size:19px; font-weight:800; border:0; cursor:pointer; font-family:inherit; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:3; }
  #hud .top { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:rgba(43,35,64,.75); color:#fff; padding:4px 16px; border-radius:99px; font-size:16px; }
  #hud .me { position:absolute; left:16px; bottom:16px; background:rgba(255,250,242,.95); border-radius:16px; padding:10px 14px; width:260px; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  #hud .me b { font-size:18px; }
  #hud .bar { height:14px; border-radius:8px; background:#e5e7eb; overflow:hidden; margin-top:4px; }
  #hud .bar i { display:block; height:100%; background:linear-gradient(90deg,#22c55e,#4ade80); transition:width .15s; }
  #hud .hint { font-size:12px; color:#6b6280; margin-top:4px; line-height:1.3; }
  #hud .skills { position:absolute; right:16px; bottom:16px; display:flex; gap:10px; pointer-events:auto; }
  .skill { position:relative; width:74px; height:74px; border-radius:50%; border:4px solid #fff; background:radial-gradient(circle at 35% 30%, #ffd58a, #ff7a59); color:#fff; font:inherit; font-weight:800; font-size:14px; cursor:pointer; overflow:hidden; box-shadow:0 6px 16px rgba(0,0,0,.25); line-height:1.05; }
  .skill.dash { background:radial-gradient(circle at 35% 30%, #a5d8ff, #4f9dff); }
  .skill span.cd { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); height:0; }
  .skill em { position:relative; font-style:normal; }
  #toast { position:fixed; top:110px; left:50%; transform:translateX(-50%); font-size:34px; font-weight:800; color:#fff; text-shadow:0 3px 0 #ff7a59, 0 6px 14px rgba(0,0,0,.3); opacity:0; pointer-events:none; z-index:6; white-space:nowrap; }
  #toast.show { animation: toast 1.8s ease-out; }
  @keyframes toast { 0%{opacity:0; transform:translate(-50%,10px) scale(.8)} 15%{opacity:1; transform:translate(-50%,0) scale(1.05)} 75%{opacity:1} 100%{opacity:0; transform:translate(-50%,-10px)} }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(43,35,64,.45); z-index:7; }
  #overlay .box { background:var(--card); padding:24px 30px; border-radius:22px; text-align:center; min-width:320px; }
  #overlay h2 { margin:0; font-size:34px; }
  #overlay button { font:inherit; font-weight:800; font-size:17px; padding:10px 20px; border-radius:12px; border:0; margin:6px; cursor:pointer; background:var(--accent); color:#fff; }
  #overlay button.alt { background:#e6dccb; color:var(--ink); }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#bfe6ff; z-index:10; font-size:22px; font-weight:800; }
  #loading .bar { width:280px; height:14px; border-radius:8px; background:#fff; overflow:hidden; margin-top:10px; }
  #loading .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .hidden { display:none !important; }
  @media (max-width: 760px) { #panel { top:auto; height:42%; left:8px; right:8px; width:auto; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<header>
  <button id="tabGallery" class="on">🧸 Showroom</button>
  <button id="tabGame">⚔️ Chơi thử</button>
</header>

<aside id="panel"></aside>

<div id="hud" class="hidden">
  <div class="top" id="stats"></div>
  <div class="me">
    <b id="heroName"></b>
    <div class="bar"><i id="heroHp"></i></div>
    <div style="font-size:13px" id="heroHpText"></div>
    <div class="hint">Bấm chuột lên đất để đi · bấm vào quái để đánh · WASD cũng đi được · Q: chiêu xoay · Space: lướt</div>
  </div>
  <div class="skills">
    <button class="skill dash" id="btnDash"><span class="cd" id="cdDash"></span><em>Lướt<br>Space</em></button>
    <button class="skill" id="btnSkill"><span class="cd" id="cdSkill"></span><em>Chiêu<br>Q</em></button>
  </div>
</div>
<div id="toast"></div>
<div id="overlay" class="hidden"><div class="box"><div id="overlayText"></div>
  <button id="again">Chơi lại</button><button class="alt" id="back">Về showroom</button></div></div>
<div id="loading">Đang tải nhân vật…<div class="bar"><i id="loadBar"></i></div><div id="loadText" style="font-size:15px;margin-top:6px"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
