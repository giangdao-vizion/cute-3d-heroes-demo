<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute 3D Heroes – demo chọn nhân vật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b2340; --card:#fffaf2; --accent:#ff7a59; --accent2:#4f9dff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink); background:#bfe6ff; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .label { position:absolute; left:0; top:0; padding:1px 9px; border-radius:99px; background:rgba(255,255,255,.85); font-size:13px; font-weight:700; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .label.sel { background:var(--accent); color:#fff; }
  .hpbar { position:absolute; left:0; top:0; width:56px; height:8px; border-radius:6px; background:rgba(0,0,0,.45); border:1.5px solid rgba(255,255,255,.9); overflow:hidden; }
  .hpbar i { display:block; height:100%; width:100%; background:#ef4444; transition:width .1s; }
  .hpbar.hero { width:74px; height:10px; } .hpbar.hero i { background:#22c55e; }
  .hpbar.boss { width:120px; height:12px; } .hpbar.boss i { background:linear-gradient(90deg,#f97316,#dc2626); }
  .dmg { position:absolute; left:0; top:0; font-weight:800; font-size:20px; text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 4px rgba(0,0,0,.4); white-space:nowrap; }

  header { position:fixed; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:rgba(255,255,255,.9); padding:5px; border-radius:99px; box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:5; }
  header button { border:0; padding:8px 20px; border-radius:99px; font:inherit; font-weight:800; font-size:16px; background:transparent; color:var(--ink); cursor:pointer; }
  header button.on { background:var(--accent); color:#fff; }

  #panel { position:fixed; right:14px; top:76px; bottom:14px; width:330px; background:var(--card); border-radius:20px; padding:16px 18px; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.15); z-index:4; }
  #panel h2 { margin:0 0 4px; font-size:26px; line-height:1.1; }
  #panel h3 { margin:16px 0 6px; font-size:16px; }
  #panel .muted { color:#6b6280; margin:6px 0 12px; }
  #panel .tags { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 12px; }
  #panel .tags span { font-size:12px; padding:1px 8px; border-radius:99px; background:#efe6ff; }
  #panel button { font:inherit; font-weight:700; cursor:pointer; border:0; }
  #panel > button, #panel [data-act] { width:100%; padding:10px; border-radius:12px; background:var(--accent2); color:#fff; font-size:16px; }
  #panel button.on { background:#22c55e; color:#fff; }
  .anims { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { padding:3px 10px; border-radius:99px; background:#fff; border:1.5px solid #e6dccb !important; font-size:13px; color:var(--ink); }
  .chip.on { background:var(--accent) !important; color:#fff; border-color:var(--accent) !important; }
  .picks { margin-top:16px; padding:10px 12px; background:#fff; border-radius:12px; font-size:14px; line-height:1.5; border:1.5px dashed #e6dccb; }
  #play { margin-top:12px; width:100%; padding:12px; border-radius:14px; background:var(--accent); color:#fff; font-size:19px; font-weight:800; border:0; cursor:pointer; font-family:inherit; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:3; }
  #hud .top { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:rgba(43,35,64,.75); color:#fff; padding:4px 16px; border-radius:99px; font-size:16px; }
  #hud .me { position:absolute; left:16px; bottom:16px; background:rgba(255,250,242,.95); border-radius:16px; padding:10px 14px; width:260px; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  #hud .me b { font-size:18px; }
  #hud .bar { height:14px; border-radius:8px; background:#e5e7eb; overflow:hidden; margin-top:4px; }
  #hud .bar i { display:block; height:100%; background:linear-gradient(90deg,#22c55e,#4ade80); transition:width .15s; }
  #hud .hint { font-size:12px; color:#6b6280; margin-top:4px; line-height:1.3; }
  #hud .skills { position:absolute; right:16px; bottom:16px; display:flex; gap:10px; pointer-events:auto; }
  .skill { position:relative; width:74px; height:74px; border-radius:50%; border:4px solid #fff; background:radial-gradient(circle at 35% 30%, #ffd58a, #ff7a59); color:#fff; font:inherit; font-weight:800; font-size:14px; cursor:pointer; overflow:hidden; box-shadow:0 6px 16px rgba(0,0,0,.25); line-height:1.05; }
  .skill.dash { background:radial-gradient(circle at 35% 30%, #a5d8ff, #4f9dff); }
  .skill span.cd { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); height:0; }
  .skill em { position:relative; font-style:normal; }
  #toast { position:fixed; top:110px; left:50%; transform:translateX(-50%); font-size:34px; font-weight:800; color:#fff; text-shadow:0 3px 0 #ff7a59, 0 6px 14px rgba(0,0,0,.3); opacity:0; pointer-events:none; z-index:6; white-space:nowrap; }
  #toast.show { animation: toast 1.8s ease-out; }
  @keyframes toast { 0%{opacity:0; transform:translate(-50%,10px) scale(.8)} 15%{opacity:1; transform:translate(-50%,0) scale(1.05)} 75%{opacity:1} 100%{opacity:0; transform:translate(-50%,-10px)} }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(43,35,64,.45); z-index:7; }
  #overlay .box { background:var(--card); padding:24px 30px; border-radius:22px; text-align:center; min-width:320px; }
  #overlay h2 { margin:0; font-size:34px; }
  #overlay button { font:inherit; font-weight:800; font-size:17px; padding:10px 20px; border-radius:12px; border:0; margin:6px; cursor:pointer; background:var(--accent); color:#fff; }
  #overlay button.alt { background:#e6dccb; color:var(--ink); }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#bfe6ff; z-index:10; font-size:22px; font-weight:800; }
  #loading .bar { width:280px; height:14px; border-radius:8px; background:#fff; overflow:hidden; margin-top:10px; }
  #loading .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }

  /* ---- Giữ cổng (thiết kế cho điện thoại trước) ---- */
  #dhud { position:fixed; inset:0; pointer-events:none; z-index:3; color:#fff; padding-top:env(safe-area-inset-top); }
  #dhud .bar { height:10px; border-radius:8px; background:rgba(0,0,0,.35); overflow:hidden; border:2px solid rgba(255,255,255,.9); }
  #dhud .bar i { display:block; height:100%; transition:width .15s; }
  .dtop { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:start; gap:8px; }
  .ic { width:1.5em; height:1.5em; object-fit:contain; vertical-align:middle; display:inline-block; pointer-events:none; }
  .ic.sm { width:1.1em; height:1.1em; }
  .dgate .ic { width:40px; height:40px; margin:-8px 0 -8px -6px; }
  .dgate { display:flex; align-items:center; gap:5px; font-size:20px; background:rgba(43,35,64,.65); padding:3px 10px 3px 6px; border-radius:99px; justify-self:start; }
  .dgate .bar { width:clamp(48px,18vw,120px); } .dgate .bar i { background:linear-gradient(90deg,#ef4444,#f97316); }
  .dgate span { font-size:15px; font-weight:800; min-width:18px; }
  .dscore { text-align:center; text-shadow:0 3px 0 rgba(0,0,0,.35); }
  #dScore { font-size:34px; font-weight:800; line-height:1; }
  .dscore small { font-size:14px; font-weight:800; } .dscore small .ic { width:22px; height:22px; margin-right:2px; }
  .dright { justify-self:end; display:flex; gap:6px; align-items:center; }
  .dwave { --p:0; position:relative; display:grid; place-items:center; width:52px; height:52px; border-radius:50%;
    background:conic-gradient(#fde047 calc(var(--p)*360deg), rgba(255,255,255,.25) 0); }
  .dwave::before { content:''; position:absolute; inset:4px; border-radius:50%; background:rgba(43,35,64,.85); }
  .dwave .ic { position:relative; width:34px; height:34px; margin-top:-6px; }
  .dwave span, .dlvl span { position:absolute; bottom:-4px; right:-4px; min-width:22px; height:22px; padding:0 5px; border-radius:99px; background:#ef4444; border:2px solid #fff; font-size:13px; font-weight:800; display:grid; place-items:center; }
  .dlvl { position:relative; width:44px; height:44px; display:grid; place-items:center; }
  .dlvl .ic { width:44px; height:44px; } .dlvl span { background:#7c3aed; }
  .dxp { position:absolute; top:calc(68px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(300px,56vw); height:6px; background:rgba(0,0,0,.25); border-radius:6px; }
  .dxp i { display:block; height:100%; width:0; background:#a78bfa; border-radius:6px; transition:width .2s; }
  #dCombo { position:absolute; top:calc(82px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); font-size:22px; color:#fde68a; text-shadow:0 2px 0 rgba(0,0,0,.45); white-space:nowrap; }
  #dCombo small { font-size:15px; } #dCombo .ic { width:30px; height:30px; }
  #dBoss { position:absolute; top:calc(114px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(360px,76vw); display:flex; align-items:center; gap:6px; font-size:22px; }
  #dBoss .ic { width:42px; height:42px; margin:-10px 0; } #dBoss .bar { flex:1; height:14px; } #dBoss .bar i { background:linear-gradient(90deg,#f97316,#dc2626); }
  .dsquad .ic { width:24px; height:24px; margin:-4px 2px -4px -6px; }
  .dsquad { position:absolute; left:0; top:0; background:#2563eb; color:#fff; font-weight:800; font-size:14px; padding:0 8px; border-radius:99px; border:2px solid #fff; }
  #dHint { position:absolute; left:50%; bottom:22%; transform:translateX(-50%); font-size:42px; opacity:0; text-shadow:0 3px 8px rgba(0,0,0,.4); }
  #dHint.on { animation:hint 1.2s ease-in-out infinite alternate; opacity:1; }
  @keyframes hint { from { transform:translateX(-90%); } to { transform:translateX(-10%); } }
  .dult .ic { position:relative; width:50px; height:50px; }
  .dult { display:grid; place-items:center; padding:0; position:absolute; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:#3b2f63; color:#fff; font-size:32px; overflow:hidden; pointer-events:auto; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.3); filter:grayscale(.6); }
  .dult span { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg,#f59e0b,#fde047); height:0; }
  .dult em { position:relative; font-style:normal; }
  .dult.ready { filter:none; animation:pulse 0.7s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.1); box-shadow:0 0 26px #fde047; } }
  .dpause { position:absolute; left:14px; bottom:calc(14px + env(safe-area-inset-bottom)); width:44px; height:44px; border-radius:50%; border:3px solid #fff; background:rgba(43,35,64,.65); color:#fff; font-size:16px; pointer-events:auto; cursor:pointer; }
  #dFlash { position:fixed; inset:0; pointer-events:none; z-index:2; box-shadow:inset 0 0 120px 30px rgba(239,68,68,.75); opacity:0; }
  #dFlash.on { animation:flash .5s ease-out; }
  @keyframes flash { 0%{opacity:1} 100%{opacity:0} }
  #dtoasts { position:fixed; top:34%; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; z-index:6; }
  .dtoast .ic { width:1.25em; height:1.25em; }
  .dtoast { font-size:28px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.3); white-space:nowrap; animation:dtoast 1.5s ease-out forwards; }
  .dtoast.small { font-size:24px; }
  .dtoast.banner { font-size:48px; animation-duration:2s; }
  @keyframes dtoast { 0%{opacity:0; transform:translateY(12px) scale(.7)} 12%{opacity:1; transform:scale(1.08)} 80%{opacity:1} 100%{opacity:0; transform:translateY(-14px)} }
  .dcrate .ic { width:24px; height:24px; margin:-5px 1px -5px -8px; }
  .dcrate { position:absolute; left:0; top:0; background:rgba(120,72,30,.9); color:#fff; font-size:13px; padding:0 7px; border-radius:8px; border:2px solid #facc15; white-space:nowrap; }
  .hpbar.elite { width:50px; } .hpbar.elite i { background:#f59e0b; }
  .dmg.big { font-size:24px; }
  #dmodal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(43,35,64,.45); z-index:8; padding:12px; }
  .dbox { background:var(--card); border-radius:24px; padding:18px 18px 20px; width:min(400px,100%); max-height:94vh; overflow:auto; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .dbig { font-size:64px; line-height:1.1; } .dbig .ic { width:96px; height:96px; }
  .dlv .ic { width:46px; height:46px; }
  .pills .ic { width:28px; height:28px; margin:-4px 0; }
  .stats .ic { width:34px; height:34px; } .gap .ic { width:22px; height:22px; }
  .dbox button .ic.btn { width:40px; height:40px; margin:-6px; }
  .dmg .ic { vertical-align:-3px; }
  .dlv { font-size:34px; font-weight:800; color:#7c3aed; }
  .dscoreBig { font-size:46px; font-weight:800; line-height:1; color:var(--accent); }
  .newbest { display:inline-block; margin-top:4px; padding:0 12px; border-radius:99px; background:#fbbf24; color:#fff; font-weight:800; animation:pulse .6s infinite alternate; }
  .gap { font-size:16px; color:#6b6280; margin-top:2px; } .gap small { font-size:13px; }
  .pills { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin:6px 0 4px; }
  .pills span { background:#fff; border-radius:99px; padding:2px 12px; font-size:18px; font-weight:800; border:1.5px solid #e6dccb; }
  .row { display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .dbox button { font:inherit; font-weight:800; cursor:pointer; border:0; border-radius:16px; padding:10px 18px; font-size:26px; background:var(--accent); color:#fff; min-width:64px; }
  .dbox button.alt { background:#e6dccb; color:var(--ink); }
  .dbox button.big { font-size:32px; padding:8px 0; flex:1; max-width:200px; }
  .shop { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:10px; }
  .dbox button.buy { display:flex; flex-direction:column; align-items:center; gap:0; padding:6px 2px; background:#fff; color:var(--ink); border:2px solid #e6dccb; min-width:0; font-size:13px; border-radius:14px; }
  .dbox button.buy:not(:disabled) { border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.2); }
  .dbox button.buy:disabled { opacity:.55; cursor:default; }
  .buy .bi .ic { width:44px; height:44px; } .buy .bc .ic { width:18px; height:18px; margin-right:1px; }
  .buy .bi { font-size:26px; line-height:1.2; } .buy .bl { font-size:12px; color:#6b6280; } .buy .bc { font-weight:800; color:#b45309; }
  .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
  .dbox button.card { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:14px 4px 10px; background:#fff; color:var(--ink); border:3px solid #cbd5e1; min-width:0; transition:transform .1s; }
  .dbox button.card:hover { transform:translateY(-4px); }
  .card.rare { border-color:#60a5fa !important; } .card.epic { border-color:#a855f7 !important; background:#faf5ff !important; }
  .card .ci .ic { width:64px; height:64px; }
  .card .ci { font-size:40px; line-height:1.1; } .card b { font-size:22px; } .card small { font-size:12px; color:#6b6280; line-height:1.15; font-weight:600; }
  .card em { position:absolute; top:4px; right:6px; font-style:normal; font-size:12px; color:#64748b; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:12px 0 0; }
  .stats div { background:#fff; border-radius:12px; padding:4px; font-size:18px; } .stats b { display:block; font-size:20px; }
  .hidden { display:none !important; }
  @media (max-width: 560px) { header button { padding:6px 12px; font-size:14px; white-space:nowrap; } header { top:8px; } }
  @media (max-width: 760px) { #panel { top:auto; height:42%; left:8px; right:8px; width:auto; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<header>
  <button id="tabGallery" class="on">🧸 Showroom</button>
  <button id="tabGame">⚔️ Chơi thử</button>
  <button id="tabDefense">🛡️ Giữ cổng</button>
</header>

<aside id="panel"></aside>

<div id="hud" class="hidden">
  <div class="top" id="stats"></div>
  <div class="me">
    <b id="heroName"></b>
    <div class="bar"><i id="heroHp"></i></div>
    <div style="font-size:13px" id="heroHpText"></div>
    <div class="hint">Bấm chuột lên đất để đi · bấm vào quái để đánh · WASD cũng đi được · Q: chiêu xoay · Space: lướt</div>
  </div>
  <div class="skills">
    <button class="skill dash" id="btnDash"><span class="cd" id="cdDash"></span><em>Lướt<br>Space</em></button>
    <button class="skill" id="btnSkill"><span class="cd" id="cdSkill"></span><em>Chiêu<br>Q</em></button>
  </div>
</div>

<div id="dFlash"></div>
<div id="dhud" class="hidden">
  <div class="dtop">
    <div class="dgate"><img class="ic" src="img/icons/tower.webp" alt=""><div class="bar"><i id="dGateBar"></i></div><span id="dGateText"></span></div>
    <div class="dscore"><div id="dScore">0</div><small id="dBest"><img class="ic" src="img/icons/trophy.webp" alt=""><span id="dBestN"></span></small></div>
    <div class="dright"><div class="dwave" id="dWaveRing"><img class="ic" src="img/icons/flag.webp" alt=""><span id="dWave"></span></div><div class="dlvl"><img class="ic" src="img/icons/gem.webp" alt=""><span id="dLv"></span></div></div>
  </div>
  <div class="dxp"><i id="dXp"></i></div>
  <div id="dCombo"></div>
  <div id="dBoss" class="hidden"><b id="dBossName"></b><div class="bar"><i id="dBossBar"></i></div></div>
  <div class="dsquad" id="dSquad" style="display:none"></div>
  <div id="dHint">👆 ↔️</div>
  <button id="dUlt" class="dult"><span id="dUltFill"></span><img class="ic" src="img/icons/star.webp" alt=""></button>
  <button id="dPause" class="dpause">⏸</button>
</div>
<div id="dtoasts"></div>
<div id="dmodal" class="hidden"></div>
<div id="toast"></div>
<div id="overlay" class="hidden"><div class="box"><div id="overlayText"></div>
  <button id="again">Chơi lại</button><button class="alt" id="back">Về showroom</button></div></div>
<div id="loading">Đang tải nhân vật…<div class="bar"><i id="loadBar"></i></div><div id="loadText" style="font-size:15px;margin-top:6px"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
