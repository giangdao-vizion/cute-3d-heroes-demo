<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Supermarket</title>
<meta name="theme-color" content="#1f8f6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Supermarket">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f8f6c'/%3E%3Cpath fill='%23fffdf7' d='M14 22h36v6H14zm4 10h8v18h-8zm12 0h8v18h-8zm12 0h8v18h-8z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ms-ink:#1f3a46; --ms-bg:#d8eef5; --ms-accent:#1f8f6c; --ms-money:#e6b422; --ms-panel:#fffdf7;
  }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:'Baloo 2', system-ui, sans-serif; color:var(--ms-ink); background:var(--ms-bg); touch-action:none; }
  body, #app { position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:100%; }
  canvas#stage { position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:100%; display:block; touch-action:none; }
  .hidden { display:none !important; }
  #splash {
    position:fixed; inset:0; z-index:5; display:flex; align-items:flex-end; justify-content:center;
    padding:18px 16px calc(22px + env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 20% 18%, rgba(255,255,255,.7), transparent 28%),
      linear-gradient(165deg, #c8ebf5 0%, #d8eef5 48%, #e7f6d8 100%);
  }
  .splash-card {
    width:min(420px,100%); padding:18px 16px 16px; border:2px solid rgba(255,255,255,.85);
    border-radius:28px; background:rgba(255,253,247,.92); box-shadow:0 18px 40px rgba(31,58,70,.16);
  }
  .phase { display:inline-block; padding:2px 10px; border-radius:999px; background:#1f8f6c; color:#fff; font-size:12px; font-weight:800; }
  h1 { margin:10px 0 2px; font-size:clamp(28px,8vw,36px); line-height:.95; letter-spacing:-.03em; }
  .slogan { margin:0 0 12px; color:#56727c; font-size:14px; font-weight:700; }
  .sku-preview { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .sku-preview span { padding:4px 10px; border-radius:999px; background:#e7f4ea; color:#1f3a46; font-size:12px; font-weight:800; }
  #openBtn {
    width:100%; min-height:54px; border:0; border-radius:18px; background:var(--ms-accent); color:#fff;
    font:800 20px 'Baloo 2', system-ui; box-shadow:0 6px 0 #146b50; cursor:pointer;
  }
  #openBtn:active { transform:translateY(3px); box-shadow:0 3px 0 #146b50; }
  .note { margin:10px 0 0; color:#667f88; font-size:12px; font-weight:700; text-align:center; }
  #hud { position:fixed; inset:0; z-index:4; pointer-events:none; padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  .top {
    display:flex; justify-content:space-between; gap:8px; align-items:flex-start;
  }
  .pill {
    padding:8px 12px; border-radius:16px; background:rgba(255,253,247,.94); border:2px solid rgba(255,255,255,.9);
    box-shadow:0 8px 18px rgba(31,58,70,.12); font-weight:800;
  }
  #money { color:#9a6d00; font-size:20px; }
  #stats { font-size:13px; max-width:58vw; }
  #hint {
    position:absolute; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
    padding:10px 14px; border-radius:16px; background:rgba(31,58,70,.86); color:#fff; font-size:13px; font-weight:700; text-align:center;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <div id="splash">
    <div class="splash-card">
      <span class="phase" id="phaseTag">M2</span>
      <h1 id="brandName">My Supermarket</h1>
      <p class="slogan" id="brandSlogan">Build your aisle empire.</p>
      <div class="sku-preview" id="skuPreview"></div>
      <button id="openBtn">Mở cửa</button>
      <p class="note">Bản M2: khách đi mua · hiệu ứng kệ · chạm tiền để thu</p>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="top">
      <div class="pill" id="money">$0</div>
      <div class="pill" id="stats">...</div>
      <button class="pill" id="speedBtn" style="pointer-events:auto;border:0;cursor:pointer">x1</button>
    </div>
    <div id="hint">Khách đi mua hàng · chạm đống tiền vàng để thu</div>
  </div>
</div>

<script type="module" src="js/supermarket/main.js?v=m2"></script>
</body>
</html>
